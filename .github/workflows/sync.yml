name: DCS SE/DK Sync

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run SE/DK Filter
        run: python filter_dcs_se_dk.py

      - name: Sync to Base.com
        env:
          BASELINKER_API_TOKEN: ${{ secrets.BASELINKER_API_TOKEN }}
        run: python sync_dcs_to_base.py

      - name: Commit Filtered Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add dcs_filtered_se_dk.json
          git commit -m "Automated DCS SE/DK tax-safe catalog sync" || exit 0
          git push
