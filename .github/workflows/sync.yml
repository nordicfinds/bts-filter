name: Daily Catalog Filter Sync

on:
  schedule:
    - cron: '0 4 * * *' # Runs every morning at 04:00 AM UTC
  workflow_dispatch: # Allows running manually anytime

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests zeep pandas openpyxl

      - name: Run filter scripts
        run: |
          python filter.py
          python filter_beautyfort.py

      - name: Commit and push clean CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bts_filtered.csv beautyfort_filtered.csv
          git commit -m "Updated BTS and Beauty Fort catalogs" || exit 0
          git push
