name: DCS SE/DK Catalog Filter

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run SE/DK Filter
        run: python filter_dcs_se_dk.py

      - name: Commit Filtered CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add dcs_filtered_se_dk.csv
          git commit -m "Automated DCS tax-safe CSV update" || exit 0
          git push
