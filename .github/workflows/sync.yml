name: DCS and Catalog 3-Hour Sync

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 1. ADD THIS PERMISSIONS BLOCK
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # 2. ENSURE CREDENTIALS PERSIST

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip instally requests || pip install requests

      - name: Run DCS Filter
        run: python filter_dcs.py

      - name: Sync DCS to Base.com
        env:
          BASELINKER_API_TOKEN: ${{ secrets.BASELINKER_API_TOKEN }}
        run: python sync_dcs_to_base.py

      - name: Commit Filtered Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add dcs_filtered_se_dk.json dcs_filtered_dk_only.json
          git commit -m "Automated 3-hour DCS catalog sync with images" || exit 0
          git push
