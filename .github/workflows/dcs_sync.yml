name: DCS Tech Catalog Sync

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync-dcs:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run Chargers & Cables
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python chargers_cables.py

      - name: Run Audio & Headphones
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python audio_headphones.py

      - name: Run Gaming & Consoles
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python gaming_consoles.py

      - name: Run Screen Protection
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python screen_protection.py

      - name: Run Mounts & Storage
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python mounts_storage.py

      - name: Run Personal Care Electronics
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python personal_care_electronics.py

      - name: Commit Filtered CSVs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.csv
          git diff-index --quiet HEAD || git commit -m "Automated multi-category DCS catalog update"
          git push
