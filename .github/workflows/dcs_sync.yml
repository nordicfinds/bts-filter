name: DCS Tech Catalog Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-dcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run DCS Product Filter
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: |
          python filter_dcs.py

      - name: Commit Filtered CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dcs_filtered.csv
          git commit -m "Automated DCS master catalog update" || exit 0
          git push
