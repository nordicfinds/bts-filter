name: DCS Tech Catalog Sync

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync-dcs:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run Chargers & Cables
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python chargers_cables.py

      - name: Run Audio & Headphones
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python audio_headphones.py

      - name: Run Gaming & Consoles
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python gaming_consoles.py

      - name: Run Screen Protection
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python screen_protection.py

      - name: Run Mounts & Storage
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python mounts_storage.py

      - name: Run Personal Care Electronics
        env:
          DCS_FEED_URL: ${{ secrets.DCS_FEED_URL }}
        run: python personal_care_electronics.py

      - name: Combine 6 DCS CSVs into Master Catalog
        run: |
          python -c "
          import pandas as pd
          import os

          dcs_files = [
              'chargers_cables.csv',
              'audio_headphones.csv',
              'gaming_consoles.csv',
              'screen_protection.csv',
              'mounts_storage.csv',
              'personal_care.csv'
          ]

          df_list = []
          for f in dcs_files:
              if os.path.exists(f):
                  try:
                      df = pd.read_csv(f, on_bad_lines='skip')
                      if not df.empty:
                          df_list.append(df)
                  except Exception as e:
                      print(f'Skipping {f} due to error: {e}')

          if df_list:
              master_df = pd.concat(df_list, ignore_index=True)
              master_df.to_csv('master_catalog.csv', index=False)
              print('Successfully generated master_catalog.csv with', len(master_df), 'items')
          else:
              print('No valid CSV data found to merge.')
          "

      - name: Commit Filtered CSVs & Master Catalog
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add master_catalog.csv *.csv
          git diff-index --quiet HEAD || git commit -m "Automated multi-category DCS catalog update and master merge"
          git push
